<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrimPro Studio - Video Trimmer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #071325;
      --bg-card: #0b1f3a;
      --accent-blue: #1d4ed8;
      --accent-cyan: #00d2ff;
      --surface-btn: #132e52;
      --text-white: #ffffff;
      --text-muted: #8892b0;
      --radius-lg: 16px;
      --radius-md: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--bg-card);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--accent-cyan);
      text-decoration: none;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* UPLOAD BUTTONS */
    .btn-group {
      position: relative;
      display: inline-flex;
    }

    .split-btn-main {
      background: #1e3a8a;
      color: #fff;
      border: none;
      padding: 1rem 2rem;
      font-weight: 700;
      font-size: 1.1rem;
      border-top-left-radius: var(--radius-md);
      border-bottom-left-radius: var(--radius-md);
      cursor: pointer;
    }

    .split-btn-arrow {
      background: #1e40af;
      color: #fff;
      border: none;
      padding: 1rem 1.2rem;
      border-top-right-radius: var(--radius-md);
      border-bottom-right-radius: var(--radius-md);
      cursor: pointer;
      border-left: 1px solid rgba(255, 255, 255, 0.15);
    }

    .dropdown-menu {
      position: absolute;
      top: 105%;
      left: 0;
      background: #ffffff;
      color: #000;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      width: 200px;
      display: none;
      flex-direction: column;
      z-index: 100;
      overflow: hidden;
      padding: 6px 0;
    }

    .dropdown-menu.show { display: flex; }

    .dropdown-item {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      text-decoration: none;
    }

    .dropdown-item:hover { background: #f1f5f9; }

    /* URL MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-box {
      background: #ffffff;
      color: #0f172a;
      padding: 1.5rem 2rem;
      border-radius: 16px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .modal-box h4 {
      font-size: 1rem;
      margin-bottom: 0.8rem;
      color: #334155;
    }

    .modal-box input {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      border: 2px solid #2563eb;
      font-size: 1rem;
      margin-bottom: 1.5rem;
      outline: none;
    }

    .modal-box input::placeholder {
      color: #94a3b8;
      opacity: 0.8;
      font-weight: 400;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .modal-btn {
      padding: 0.6rem 1.4rem;
      border-radius: 20px;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-btn.cancel { background: #e2e8f0; color: #334155; }
    .modal-btn.ok { background: #1d4ed8; color: #fff; }

    /* EDITOR CONTAINER */
    .editor-container {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 850px;
      gap: 1.5rem;
      position: relative;
    }

    .video-frame {
      width: 100%;
      height: 380px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-frame video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* TIMELINE */
    .timeline-container {
      width: 100%;
      position: relative;
      padding-top: 35px;
    }

    .playhead-indicator {
      position: absolute;
      top: 0;
      left: 0%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 50;
    }

    .playhead-tooltip {
      background: #ffffff;
      color: #000;
      font-weight: 800;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 10px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .playhead-line {
      width: 2px;
      height: 60px;
      background: #ffffff;
      box-shadow: 0 0 4px rgba(0,0,0,0.8);
    }

    .timeline-track {
      height: 60px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      position: relative;
      touch-action: none;
      cursor: pointer;
    }

    .cut-overlay {
      position: absolute;
      top: 0;
      height: 100%;
      border-top: 3px solid var(--accent-cyan);
      border-bottom: 3px solid var(--accent-cyan);
      background: rgba(0, 210, 255, 0.25);
      pointer-events: none;
    }

    .handle {
      position: absolute;
      top: 0;
      width: 16px;
      height: 100%;
      background: var(--accent-cyan);
      cursor: ew-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      border-radius: 2px;
    }

    .handle::after {
      content: '⋮';
      color: #000;
      font-weight: 900;
      font-size: 10px;
    }

    .handle.left { left: 0%; transform: translateX(-50%); }
    .handle.right { left: 100%; transform: translateX(-50%); }

    /* CONTROLS & TIME INPUTS WITH ARROWS */
    .editor-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .time-control-group {
      background: #0d1e36;
      border-radius: 20px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .time-input-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .time-input {
      background: transparent;
      border: none;
      color: #00d2ff;
      font-weight: 800;
      font-size: 1.1rem;
      width: 75px;
      text-align: center;
      outline: none;
      font-family: monospace;
    }

    .time-input::selection {
      background: #1d4ed8;
      color: #fff;
    }

    .arrow-buttons {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .arrow-btn {
      background: transparent;
      border: none;
      color: #475569;
      font-size: 8px;
      cursor: pointer;
      line-height: 1;
      padding: 2px 4px;
      transition: color 0.2s;
    }

    .arrow-btn:hover { color: #00d2ff; }

    .actions-right {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    .settings-btn {
      background: var(--surface-btn);
      border: none;
      color: #fff;
      width: 48px;
      height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
    }

    .save-btn {
      background: #ffffff;
      color: #041226;
      font-weight: 800;
      padding: 0.85rem 2.2rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }

    /* POPUP FORMAT */
    .format-popover {
      position: absolute;
      bottom: 120%;
      right: 0;
      background: #000000;
      color: #fff;
      padding: 1.25rem;
      border-radius: 16px;
      width: 330px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      display: none;
      flex-direction: column;
      gap: 1rem;
      z-index: 100;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .format-popover.show { display: flex; }

    .format-buttons {
      display: flex;
      background: #18181b;
      border-radius: 10px;
      padding: 4px;
      justify-content: space-between;
    }

    .format-btn {
      background: transparent;
      border: none;
      color: #a1a1aa;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .format-btn.active {
      background: #27272a;
      color: #10b981;
    }

    .toggle-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 5px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #3f3f46;
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: #2563eb; }
    input:checked + .slider:before { transform: translateX(20px); }

    .toggle-text {
      font-size: 0.8rem;
      color: #a1a1aa;
      line-height: 1.3;
    }

    .toggle-text strong {
      display: block;
      color: #fff;
      font-size: 0.9rem;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">TrimPro Studio</a>
  </header>

  <main>
    <!-- UPLOAD VIEW -->
    <div id="uploadView" style="text-align: center;">
      <div style="background: var(--bg-card); padding: 4rem 3rem; border-radius: 16px; border: 2px dashed rgba(0,210,255,0.2);">
        <h2 style="margin-bottom: 0.5rem;">Trim or cut video of any format</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Upload your file to start editing</p>
        <input type="file" id="fileInput" accept="video/*" style="display: none;">
        
        <div class="btn-group">
          <button class="split-btn-main" onclick="document.getElementById('fileInput').click()">Choose File</button>
          <button class="split-btn-arrow" id="dropdownToggle">▼</button>

          <div class="dropdown-menu" id="dropdownMenu">
            <div class="dropdown-item" id="urlOption">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
              From URL
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- URL MODAL -->
    <div class="modal-overlay" id="urlModal">
      <div class="modal-box">
        <h4>Open from URL</h4>
        <input type="text" id="videoUrlInput" placeholder="https://">
        <div class="modal-actions">
          <button class="modal-btn ok" id="loadUrlBtn">OK</button>
          <button class="modal-btn cancel" id="closeModal">Cancel</button>
        </div>
      </div>
    </div>

    <!-- EDITOR VIEW -->
    <div id="editorView" class="editor-container">
      <div class="video-frame">
        <video id="videoPlayer" crossorigin="anonymous" playsinline></video>
      </div>

      <div class="timeline-container">
        <!-- Playhead Indicator -->
        <div class="playhead-indicator" id="playheadIndicator">
          <div class="playhead-tooltip" id="playheadTooltip">00:00.0</div>
          <div class="playhead-line"></div>
        </div>

        <div class="timeline-track" id="timelineTrack">
          <div class="cut-overlay" id="cutOverlay"></div>
          <div class="handle left" id="handleLeft"></div>
          <div class="handle right" id="handleRight"></div>
        </div>
      </div>

      <div class="editor-controls">
        <button style="background: var(--surface-btn); border: none; color: #fff; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 700; cursor: pointer;" id="playBtn">▶ Play</button>

        <!-- Dynamic Time Control Boxes with Arrows -->
        <div class="time-control-group">
          <!-- Start Time Input -->
          <div class="time-input-wrapper">
            <input type="text" class="time-input" id="startTimeInput" value="00:00.0">
            <div class="arrow-buttons">
              <button class="arrow-btn" id="startUpBtn">▲</button>
              <button class="arrow-btn" id="startDownBtn">▼</button>
            </div>
          </div>

          <!-- End Time Input -->
          <div class="time-input-wrapper">
            <input type="text" class="time-input" id="endTimeInput" value="00:00.0">
            <div class="arrow-buttons">
              <button class="arrow-btn" id="endUpBtn">▲</button>
              <button class="arrow-btn" id="endDownBtn">▼</button>
            </div>
          </div>
        </div>

        <div class="actions-right">
          <button class="settings-btn" id="settingsToggle">⚙</button>

          <div class="format-popover" id="formatPopover">
            <h4>File format</h4>
            <div class="format-buttons">
              <button class="format-btn active" data-format="mp4">MP4</button>
              <button class="format-btn" data-format="mkv">MKV</button>
              <button class="format-btn" data-format="mov">MOV</button>
              <button class="format-btn" data-format="auto">Auto</button>
            </div>

            <div class="toggle-row">
              <label class="switch">
                <input type="checkbox" id="noReencodeToggle">
                <span class="slider"></span>
              </label>
              <div class="toggle-text">
                <strong>No re-encoding</strong>
                Available only when trimming or rotating. When enabled, saving is instant.
              </div>
            </div>
          </div>

          <button class="save-btn" id="saveBtn">Save</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const dropdownToggle = document.getElementById('dropdownToggle');
      const dropdownMenu = document.getElementById('dropdownMenu');
      const urlOption = document.getElementById('urlOption');
      const urlModal = document.getElementById('urlModal');
      const closeModal = document.getElementById('closeModal');
      const loadUrlBtn = document.getElementById('loadUrlBtn');
      const videoUrlInput = document.getElementById('videoUrlInput');
      
      const fileInput = document.getElementById('fileInput');
      const videoPlayer = document.getElementById('videoPlayer');
      const uploadView = document.getElementById('uploadView');
      const editorView = document.getElementById('editorView');

      const settingsToggle = document.getElementById('settingsToggle');
      const formatPopover = document.getElementById('formatPopover');
      const formatBtns = document.querySelectorAll('.format-btn');
      
      const timelineTrack = document.getElementById('timelineTrack');
      const cutOverlay = document.getElementById('cutOverlay');
      const handleLeft = document.getElementById('handleLeft');
      const handleRight = document.getElementById('handleRight');
      const playheadIndicator = document.getElementById('playheadIndicator');
      const playheadTooltip = document.getElementById('playheadTooltip');
      
      const startTimeInput = document.getElementById('startTimeInput');
      const endTimeInput = document.getElementById('endTimeInput');
      
      const startUpBtn = document.getElementById('startUpBtn');
      const startDownBtn = document.getElementById('startDownBtn');
      const endUpBtn = document.getElementById('endUpBtn');
      const endDownBtn = document.getElementById('endDownBtn');

      const playBtn = document.getElementById('playBtn');
      const saveBtn = document.getElementById('saveBtn');

      let videoDuration = 0;
      let startPercent = 0;
      let endPercent = 100;
      let activeHandle = null;
      let isSeekingTimeline = false;
      let selectedFormat = 'mp4';

      // Dropdown handlers
      dropdownToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdownMenu.classList.toggle('show');
      });

      document.addEventListener('click', () => {
        dropdownMenu.classList.remove('show');
        formatPopover.classList.remove('show');
      });

      urlOption.addEventListener('click', () => { urlModal.style.display = 'flex'; });
      closeModal.addEventListener('click', () => { urlModal.style.display = 'none'; });

      loadUrlBtn.addEventListener('click', () => {
        const url = videoUrlInput.value.trim();
        if (url) {
          videoPlayer.src = url;
          urlModal.style.display = 'none';
          uploadView.style.display = 'none';
          editorView.style.display = 'flex';
        }
      });

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          videoPlayer.src = URL.createObjectURL(file);
          uploadView.style.display = 'none';
          editorView.style.display = 'flex';
        }
      });

      settingsToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        formatPopover.classList.toggle('show');
      });

      formatPopover.addEventListener('click', (e) => e.stopPropagation());

      formatBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          formatBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedFormat = btn.getAttribute('data-format');
        });
      });

      function formatTime(seconds) {
        if (isNaN(seconds) || seconds < 0) return "00:00.0";
        const mins = Math.floor(seconds / 60);
        const secs = (seconds % 60).toFixed(1);
        return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
      }

      videoPlayer.onloadedmetadata = () => {
        videoDuration = videoPlayer.duration;
        startPercent = 0;
        endPercent = 100;
        updateUI();
      };

      function updateUI() {
        if (!videoDuration) return;

        cutOverlay.style.left = startPercent + '%';
        cutOverlay.style.width = (endPercent - startPercent) + '%';
        
        handleLeft.style.left = startPercent + '%';
        handleRight.style.left = endPercent + '%';

        const startTime = (startPercent / 100) * videoDuration;
        const endTime = (endPercent / 100) * videoDuration;

        startTimeInput.value = formatTime(startTime);
        endTimeInput.value = formatTime(endTime);

        updatePlayhead();
      }

      function updatePlayhead() {
        if (!videoDuration) return;
        const currentPercent = (videoPlayer.currentTime / videoDuration) * 100;
        playheadIndicator.style.left = currentPercent + '%';
        playheadTooltip.textContent = formatTime(videoPlayer.currentTime);
      }

      // Drag and Timeline seeking
      const startDrag = (handle) => (e) => {
        e.stopPropagation();
        e.preventDefault();
        activeHandle = handle;
      };

      handleLeft.addEventListener('mousedown', startDrag('left'));
      handleRight.addEventListener('mousedown', startDrag('right'));
      handleLeft.addEventListener('touchstart', startDrag('left'));
      handleRight.addEventListener('touchstart', startDrag('right'));

      timelineTrack.addEventListener('mousedown', (e) => {
        if (e.target === handleLeft || e.target === handleRight) return;
        isSeekingTimeline = true;
        seekTimeline(e);
      });

      function seekTimeline(e) {
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const rect = timelineTrack.getBoundingClientRect();
        let percent = ((clientX - rect.left) / rect.width) * 100;
        percent = Math.max(0, Math.min(100, percent));
        
        videoPlayer.currentTime = (percent / 100) * videoDuration;
        updatePlayhead();
      }

      const onMove = (e) => {
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const rect = timelineTrack.getBoundingClientRect();
        let percent = ((clientX - rect.left) / rect.width) * 100;
        percent = Math.max(0, Math.min(100, percent));

        if (activeHandle) {
          if (activeHandle === 'left') {
            if (percent < endPercent - 1) {
              startPercent = percent;
              videoPlayer.currentTime = (startPercent / 100) * videoDuration;
            }
          } else if (activeHandle === 'right') {
            if (percent > startPercent + 1) {
              endPercent = percent;
              videoPlayer.currentTime = (endPercent / 100) * videoDuration;
            }
          }
          updateUI();
        } else if (isSeekingTimeline) {
          seekTimeline(e);
        }
      };

      window.addEventListener('mousemove', onMove);
      window.addEventListener('touchmove', onMove);

      window.addEventListener('mouseup', () => { activeHandle = null; isSeekingTimeline = false; });
      window.addEventListener('touchend', () => { activeHandle = null; isSeekingTimeline = false; });

      videoPlayer.addEventListener('timeupdate', () => {
        updatePlayhead();
        const endTime = (endPercent / 100) * videoDuration;
        if (videoPlayer.currentTime >= endTime) {
          videoPlayer.pause();
          playBtn.textContent = '▶ Play';
        }
      });

      // TIME ADJUSTMENT LOGIC VIA ARROWS & KEYBOARD
      function adjustTime(type, direction) {
        if (!videoDuration) return;
        let currentTime = (type === 'start' ? startPercent : endPercent) / 100 * videoDuration;
        let newTime = currentTime + (direction * 0.1); // Frame adjustment step

        if (type === 'start') {
          newTime = Math.max(0, Math.min(newTime, (endPercent / 100 * videoDuration) - 0.1));
          startPercent = (newTime / videoDuration) * 100;
        } else {
          newTime = Math.min(videoDuration, Math.max(newTime, (startPercent / 100 * videoDuration) + 0.1));
          endPercent = (newTime / videoDuration) * 100;
        }

        videoPlayer.currentTime = newTime;
        updateUI();
      }

      startUpBtn.addEventListener('click', () => adjustTime('start', 1));
      startDownBtn.addEventListener('click', () => adjustTime('start', -1));
      endUpBtn.addEventListener('click', () => adjustTime('end', 1));
      endDownBtn.addEventListener('click', () => adjustTime('end', -1));

      // KEYBOARD CONTROL ON INPUT FOCUS
      [startTimeInput, endTimeInput].forEach((input, index) => {
        input.addEventListener('keydown', (e) => {
          const type = index === 0 ? 'start' : 'end';
          if (e.key === 'ArrowUp') {
            e.preventDefault();
            adjustTime(type, 1);
          } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            adjustTime(type, -1);
          }
        });
      });

      // GLOBAL KEYBOARD ARROW CONTROLS
      window.addEventListener('keydown', (e) => {
        if (document.activeElement.tagName === 'INPUT') return;
        if (editorView.style.display !== 'flex' || !videoDuration) return;

        const step = e.shiftKey ? 1.0 : 0.1;

        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          videoPlayer.currentTime = Math.max(0, videoPlayer.currentTime - step);
          updatePlayhead();
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          videoPlayer.currentTime = Math.min(videoDuration, videoPlayer.currentTime + step);
          updatePlayhead();
        } else if (e.key === ' ') {
          e.preventDefault();
          playBtn.click();
        }
      });

      playBtn.addEventListener('click', () => {
        if (videoPlayer.paused) {
          const startTime = (startPercent / 100) * videoDuration;
          if (videoPlayer.currentTime < startTime || videoPlayer.currentTime >= (endPercent / 100) * videoDuration) {
            videoPlayer.currentTime = startTime;
          }
          videoPlayer.play();
          playBtn.textContent = '⏸ Pause';
        } else {
          videoPlayer.pause();
          playBtn.textContent = '▶ Play';
        }
      });

      saveBtn.addEventListener('click', async () => {
        saveBtn.textContent = "Processing...";
        saveBtn.disabled = true;

        const startTime = (startPercent / 100) * videoDuration;
        const endTime = (endPercent / 100) * videoDuration;

        videoPlayer.currentTime = startTime;
        await new Promise(r => videoPlayer.onseeked = r);

        videoPlayer.playbackRate = 1.0;

        let stream = videoPlayer.captureStream ? videoPlayer.captureStream() : videoPlayer.mozCaptureStream();
        let mimeType = 'video/mp4';
        if (!MediaRecorder.isTypeSupported(mimeType)) {
          mimeType = 'video/webm;codecs=vp9';
        }

        const recorder = new MediaRecorder(stream, { mimeType });
        const chunks = [];
        recorder.ondataavailable = e => chunks.push(e.data);

        recorder.onstop = () => {
          const ext = selectedFormat === 'auto' ? 'mp4' : selectedFormat;
          const blob = new Blob(chunks, { type: 'video/mp4' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `trimmed_video.${ext}`;
          a.click();

          saveBtn.textContent = "Save";
          saveBtn.disabled = false;
        };

        recorder.start();
        videoPlayer.play();

        const checkTime = setInterval(() => {
          if (videoPlayer.currentTime >= endTime || videoPlayer.ended) {
            clearInterval(checkTime);
            videoPlayer.pause();
            recorder.stop();
          }
        }, 50);
      });
    });
  </script>
</body>
</html>
